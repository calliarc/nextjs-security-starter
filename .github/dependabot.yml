version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # eslint-plugin-react (bundled by eslint-config-next) does not support ESLint 10 yet.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 broke CI on the Dependabot bump; upgrade manually once tooling supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      next-and-react:
        patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react", "@types/react-dom"]
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
